name: CI

# Lint then tests on every push and PR. windows-latest, not ubuntu: this repo is
# developed and run on Windows, and a first CI that goes red on a path-separator
# or encoding difference teaches people to ignore CI.

on:
  push:
    branches: [main, 'jl/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    env:
      # A broken user-site package can shadow pandas/pyarrow, and Windows needs
      # the encoding pinned explicitly. Same contract as the local terminals.
      PYTHONNOUSERSITE: '1'
      PYTHONIOENCODING: 'utf-8'
      # The suite blanks provider credentials itself in tests/conftest.py. Set
      # empty here too so a stray runner secret can never win the import race.
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      GOOGLE_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # data/ is not in the repo, so tests needing archived filings skip
        # themselves. That is expected, not a gap — see the `network` marker.
        run: python -m pytest -m "not network"
