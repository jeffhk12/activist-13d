name: Offline nonlinear model checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ml_experiment/nonlinear_models.py'
      - 'scripts/ml_experiment/run_nonlinear.py'
      - 'tests/test_ml_nonlinear.py'
      - 'research/protocol/ml-nonlinear-v1.json'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-model-checks.yml'

permissions:
  contents: read

jobs:
  synthetic-model-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install model verification dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Verify invented examples only
        # research/runs is excluded from git: the real-archive preparation check
        # skips. No test fits the real 13D outcomes, even when archives exist.
        run: python -m pytest tests/test_ml_nonlinear.py tests/test_ml_baselines.py -k "not offline_artifact_replay" -q
