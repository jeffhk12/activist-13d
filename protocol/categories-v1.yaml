{
  "version": "v1",
  "status": "development_draft_not_validated",
  "decision_rule": "Assign present only for an explicit request, proposed action, or stated plan attributable to the reporting person and directed at the issuer. An explicit plan can be contingent on execution without becoming generic boilerplate. Mere willingness, possibilities, investment reservations, third-party history and past completed actions alone do not establish a current objective. Use not_stated only after adequate evidence review finds no qualifying objective; use cannot_determine for material missing evidence, ambiguous attribution or unresolved intent. Multiple categories may apply to one filing. Each positive needs its own supporting passage. Generic reservations alone are nonqualifying; a specific but genuinely unresolved conditional interest remains cannot_determine for the implicated category.",
  "categories": [
    {"id":"board_representation","name":"Board representation or composition","definition":"Seeking board seats, nominating/removing directors, or proposing a change in board composition.","include":"A stated nomination plan or request for board representation.","exclude":"A generic right to discuss management; historical board membership without a new or continuing objective.","positive_example":"We intend to nominate two directors at the next annual meeting.","negative_example":"We may discuss various matters with management from time to time."},
    {"id":"leadership_change","name":"Executive leadership change","definition":"Seeking replacement, removal, appointment or restructuring of executive leadership.","include":"An explicit request to replace the CEO or change executive management.","exclude":"Director changes alone; a description of an executive transition without attributing a request or plan to the reporting person.","positive_example":"We urge the board to begin a search for a new chief executive.","negative_example":"The company appointed a chief executive last year."},
    {"id":"capital_return","name":"Return of capital","definition":"Seeking dividends, share repurchases or another explicit distribution of capital to shareholders.","include":"An issuer buyback or special-dividend proposal.","exclude":"The investor selling its own shares; an issuer distribution mentioned only as background.","positive_example":"We have asked the company to pay a special dividend.","negative_example":"We reserve the right to sell our shares."},
    {"id":"capital_structure","name":"Capital structure or financing","definition":"Seeking changes to issuer debt, leverage, equity financing or recapitalization.","include":"A requested debt reduction, refinancing, leverage change or recapitalization.","exclude":"Borrowing used by the reporting person to buy shares; ordinary share repurchases absent a separately stated financing/leverage objective.","positive_example":"We propose that the issuer reduce debt using its excess cash.","negative_example":"Our purchase was financed with a margin loan."},
    {"id":"sale_of_company","name":"Sale or merger of the issuer","definition":"Seeking a sale, merger, take-private or other transaction transferring control of the issuer as a whole.","include":"An explicit request to pursue a whole-company sale or an attributable proposal to acquire the issuer.","exclude":"Only selling a subsidiary; unspecified strategic alternatives that do not identify a sale/merger objective.","positive_example":"We urge the board to initiate a sale process for the company.","negative_example":"We believe the board should consider unspecified strategic alternatives."},
    {"id":"asset_transaction","name":"Asset, business or separation transaction","definition":"Seeking a divestiture, spin-off, split-up, asset sale or acquisition of a business/assets.","include":"A specific request to sell or separate a business unit, or pursue an asset/business acquisition.","exclude":"An investor purchasing securities; a whole-company sale alone.","positive_example":"We request a spin-off of the distribution subsidiary.","negative_example":"We acquired additional common shares in the open market."},
    {"id":"operational_change","name":"Operating or business strategy change","definition":"Seeking changes to operating performance, costs, business allocation, products or operating strategy.","include":"An explicit cost-reduction, operating restructuring or business-strategy demand.","exclude":"Undervaluation claims, dissatisfaction or goals to maximize value without a specified operating action.","positive_example":"We have requested closure of the unprofitable manufacturing sites.","negative_example":"We believe the shares are undervalued."},
    {"id":"governance_change","name":"Governance policy or shareholder rights","definition":"Seeking changes to governance rules, executive compensation policy, voting arrangements or shareholder rights.","include":"Eliminating a classified board/poison pill, changing voting rules or compensation policy.","exclude":"Seeking director seats alone unless a separate governance-policy change is stated.","positive_example":"We propose eliminating the classified board structure.","negative_example":"We intend to nominate one director."},
    {"id":"other_stated_objective","name":"Other specific stated objective","definition":"A specific issuer-directed objective satisfying the attribution/evidence rule but not captured by the eight named categories.","include":"An explicit objective with a short description explaining why no named category fits; a demand for a strategic review without a specified transaction can fall here.","exclude":"A catch-all for generic investment intent, insufficient evidence or classifier uncertainty.","positive_example":"We have formally requested an independent review of strategic alternatives, without prescribing a transaction.","negative_example":"We acquired shares for investment purposes and retain all options."}
  ]
}
